services:
  jenkins:
    container_name: jenkins
    build:
      context: jenkins
    ports:
      - "8092:8080"
      - "50000:50000"
    environment:
      - KUBECONFIG=/var/jenkins_home/.kube/config
    volumes:
      - /opt/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

